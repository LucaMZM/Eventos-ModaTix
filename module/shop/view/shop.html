<main class="max-w-7xl mx-auto w-full px-4 py-8 md:py-12" id="modatix-shop">
    <section class="mb-8 md:mb-10">
        <h1 class="text-4xl md:text-5xl font-black tracking-tight text-slate-900 dark:text-white">SHOP DE EVENTOS</h1>
        <p class="mt-3 text-slate-600 dark:text-slate-300 max-w-3xl">Explora los eventos disponibles y entra al detalle para ver información completa.</p>
    </section>

    <section id="shop-list-section">
        <div class="mb-8 bg-white dark:bg-background-dark border border-slate-200 dark:border-primary/10 rounded-xl p-4 md:p-5 shadow-xl" id="shop-filters-panel">
            <div id="shop-filters"></div>
        </div>
        <div class="mb-6 bg-white dark:bg-background-dark border border-slate-200 dark:border-primary/10 rounded-xl p-2 md:p-3 shadow-xl" id="shop-map-panel">
            <div class="h-72 md:h-[420px] rounded-lg overflow-hidden" id="shop-map-list"></div>
        </div>
        <div class="mb-4 text-sm text-slate-600 dark:text-slate-300">
            <span class="font-black text-primary" id="shop-events-count">0</span> eventos encontrados
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="content_shop_events"></div>
        <div class="mt-6 flex items-center justify-center" id="shop-pagination"></div>
    </section>

    <section class="hidden" id="shop-details-section">
        <div class="mb-6">
            <button class="bg-primary text-background-dark px-5 py-2 rounded-lg font-bold hover:bg-primary/90 transition-colors" id="back_to_shop" type="button">
                Volver al listado
            </button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch min-w-0">
            <div class="lg:col-span-5 flex flex-col h-full min-w-0 overflow-hidden">
                <div class="swiper shop-detail-swiper w-full max-w-full min-w-0 rounded-xl overflow-hidden border border-slate-200 dark:border-primary/10 shadow-xl">
                    <div class="swiper-wrapper" id="shop-detail-images"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-pagination"></div>
                </div>
                <div class="mt-4 bg-white dark:bg-background-dark border border-slate-200 dark:border-primary/10 rounded-xl p-2 shadow-xl flex-1 min-h-[260px] min-w-0" id="shop-detail-map-panel">
                    <div class="h-full min-h-[240px] rounded-lg overflow-hidden" id="shop-map-detail"></div>
                </div>
            </div>
            <div class="lg:col-span-7 h-full min-w-0">
                <article class="bg-white dark:bg-background-dark border border-slate-200 dark:border-primary/10 rounded-xl p-5 md:p-6 shadow-xl h-full" id="shop-detail-main"></article>
            </div>
        </div>
        <div class="mt-6 bg-white dark:bg-background-dark border border-slate-200 dark:border-primary/10 rounded-xl p-5 md:p-6 shadow-xl" id="shop-detail-similar-panel">
            <h3 class="text-xl md:text-2xl font-black text-slate-900 dark:text-white mb-4">Ver más eventos en la misma ciudad</h3>
            <div id="shop-similar-events"></div>
        </div>
    </section>
</main>

<script src="module/shop/model/controller_shop.js?v=20260511c"></script>
